services:
  backend:
    build:
      context: ./backend
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      MAX_RANGE_DAYS: ${MAX_RANGE_DAYS:-31}
    ports:
      - "8000:8000"

  mcp:
    build:
      context: ./backend
    command: ["python", "src/mcp/server.py"]
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      MAX_RANGE_DAYS: ${MAX_RANGE_DAYS:-31}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_TRANSPORT: streamable-http
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
