[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle-school-lunch-backend"
version = "0.1.0"
dependencies = [
  "fastapi==0.115.2",
  "httpx==0.27.2",
  "mcp>=1.0.0,<2.0.0",
  "pydantic==2.9.2",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
